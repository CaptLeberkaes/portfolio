<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showcase — Ben</title>
  <meta name="description" content="Ausgewählte Arbeiten aus 3D, Software und interaktiven Projekten.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230c0a08'/><text x='50' y='68' font-size='58' font-family='monospace' font-weight='700' fill='%23f5a524' text-anchor='middle'>B</text></svg>">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/site.js" defer></script>
</head>
<body data-page="showcase">
  <header id="site-nav"></header>

  <main>
    <!-- SEITENKOPF -->
    <section class="page-head">
      <div class="glow glow--deep" style="width:560px;height:560px;top:-180px;left:-140px"></div>
      <div class="frame">
        <span class="eyebrow"><span data-i18n="sc.eyebrow"></span></span>
        <h1 data-i18n="sc.title"></h1>
        <p class="lead" data-i18n="sc.lead"></p>
      </div>
    </section>

    <!-- GALERIE -->
    <section class="section" style="padding-top:0">
      <div class="frame">
        <!-- Filter -->
        <div class="filters" role="group" aria-label="Filter">
          <button class="filter" data-filter="all" aria-pressed="true"><span data-i18n="sc.filter.all"></span></button>
          <button class="filter" data-filter="3d" aria-pressed="false"><span data-i18n="sc.filter.3d"></span></button>
          <button class="filter" data-filter="software" aria-pressed="false"><span data-i18n="sc.filter.software"></span></button>
          <button class="filter" data-filter="interactive" aria-pressed="false"><span data-i18n="sc.filter.interactive"></span></button>
          <button class="filter" data-filter="fotografie" aria-pressed="false"><span data-i18n="sc.filter.fotografie"></span></button>
        </div>

        <!-- Versetzte Zeilen: Bild abwechselnd links / rechts, Text + Stichpunkte daneben -->
        <div class="showcase-rows">
          <article class="show-row reveal" data-cat="3d">
            <div class="show-media" data-full="assets/img/work-01.jpg" role="button" tabindex="0" aria-label="Bild vergrößern">
              <img src="assets/img/work-01.jpg" alt="Platzhalter 01" loading="lazy" width="900" height="675">
            </div>
            <div class="show-body">
              <div class="tile-cat" data-i18n="sc.tile1.cat"></div>
              <h3 class="tile-title" data-i18n="sc.tile1.title"></h3>
              <p data-i18n="sc.tile1.desc"></p>
              <ul class="show-points">
                <li data-i18n="sc.tile1.p1"></li>
                <li data-i18n="sc.tile1.p2"></li>
                <li data-i18n="sc.tile1.p3"></li>
              </ul>
            </div>
          </article>

          <article class="show-row reveal" data-cat="3d">
            <div class="show-media" data-full="assets/img/work-02.jpg" role="button" tabindex="0" aria-label="Bild vergrößern">
              <img src="assets/img/work-02.jpg" alt="Platzhalter 02" loading="lazy" width="900" height="675">
            </div>
            <div class="show-body">
              <div class="tile-cat" data-i18n="sc.tile2.cat"></div>
              <h3 class="tile-title" data-i18n="sc.tile2.title"></h3>
              <p data-i18n="sc.tile2.desc"></p>
              <ul class="show-points">
                <li data-i18n="sc.tile2.p1"></li>
                <li data-i18n="sc.tile2.p2"></li>
                <li data-i18n="sc.tile2.p3"></li>
              </ul>
            </div>
          </article>

          <article class="show-row reveal" data-cat="3d">
            <div class="show-media" data-full="assets/img/work-03.jpg" role="button" tabindex="0" aria-label="Bild vergrößern">
              <img src="assets/img/work-03.jpg" alt="Platzhalter 03" loading="lazy" width="900" height="675">
            </div>
            <div class="show-body">
              <div class="tile-cat" data-i18n="sc.tile3.cat"></div>
              <h3 class="tile-title" data-i18n="sc.tile3.title"></h3>
              <p data-i18n="sc.tile3.desc"></p>
              <ul class="show-points">
                <li data-i18n="sc.tile3.p1"></li>
                <li data-i18n="sc.tile3.p2"></li>
                <li data-i18n="sc.tile3.p3"></li>
              </ul>
            </div>
          </article>

          <article class="show-row reveal" data-cat="fotografie">
            <div class="show-media" data-full="assets/img/photo-01.jpg" role="button" tabindex="0" aria-label="Bild vergrößern">
              <img src="assets/img/photo-01.jpg" alt="Platzhalter 04" loading="lazy" width="900" height="675">
            </div>
            <div class="show-body">
              <div class="tile-cat" data-i18n="sc.tile4.cat"></div>
              <h3 class="tile-title" data-i18n="sc.tile4.title"></h3>
              <p data-i18n="sc.tile4.desc"></p>
              <ul class="show-points">
                <li data-i18n="sc.tile4.p1"></li>
                <li data-i18n="sc.tile4.p2"></li>
                <li data-i18n="sc.tile4.p3"></li>
              </ul>
            </div>
          </article>

          <article class="show-row reveal" data-cat="fotografie">
            <div class="show-media" data-full="assets/img/photo-02.jpg" role="button" tabindex="0" aria-label="Bild vergrößern">
              <img src="assets/img/photo-02.jpg" alt="Platzhalter 05" loading="lazy" width="900" height="675">
            </div>
            <div class="show-body">
              <div class="tile-cat" data-i18n="sc.tile5.cat"></div>
              <h3 class="tile-title" data-i18n="sc.tile5.title"></h3>
              <p data-i18n="sc.tile5.desc"></p>
              <ul class="show-points">
                <li data-i18n="sc.tile5.p1"></li>
                <li data-i18n="sc.tile5.p2"></li>
                <li data-i18n="sc.tile5.p3"></li>
              </ul>
            </div>
          </article>
        </div>
      </div>
    </section>

    <!-- SOFTWARE (NDA) -->
    <section class="section">
      <div class="frame">
        <div class="reveal" style="max-width:720px;margin-bottom:40px">
          <h2 class="section-title" data-i18n="sc.soft.title"></h2>
          <p class="lead" data-i18n="sc.soft.lead"></p>
        </div>
        <div class="grid grid--2">
          <article class="case reveal">
            <span class="tag" data-i18n="sc.case1.tag"></span>
            <h3 data-i18n="sc.case1.title"></h3>
            <p data-i18n="sc.case1.desc"></p>
            <div class="metrics">
              <div class="metric"><b data-i18n="sc.case1.m1v"></b><span data-i18n="sc.case1.m1n"></span></div>
              <div class="metric"><b data-i18n="sc.case1.m2v"></b><span data-i18n="sc.case1.m2n"></span></div>
            </div>
          </article>
          <article class="case reveal" style="transition-delay:.08s">
            <span class="tag" data-i18n="sc.case2.tag"></span>
            <h3 data-i18n="sc.case2.title"></h3>
            <p data-i18n="sc.case2.desc"></p>
            <div class="metrics">
              <div class="metric"><b data-i18n="sc.case2.m1v"></b><span data-i18n="sc.case2.m1n"></span></div>
              <div class="metric"><b data-i18n="sc.case2.m2v"></b><span data-i18n="sc.case2.m2n"></span></div>
            </div>
          </article>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
