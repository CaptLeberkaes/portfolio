<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.contact.title">Kontakt — Ben</title>
  <meta name="description" data-i18n-content="meta.contact.desc" content="Kontakt aufnehmen — für Projekte, Anstellung oder Fragen.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230c0a08'/><text x='50' y='68' font-size='58' font-family='monospace' font-weight='700' fill='%23f5a524' text-anchor='middle'>B</text></svg>">
  <link rel="stylesheet" href="tech/styles.css">
  <script src="tech/i18n.js"></script>
  <script src="tech/site.js" defer></script>
</head>
<body data-page="contact">
  <header id="site-nav"></header>

  <main>
    <section class="page-head">
      <div class="frame">
        <span class="eyebrow"><span data-i18n="ct.eyebrow"></span></span>
        <h1 data-i18n="ct.title"></h1>
        <p class="lead" data-i18n="ct.lead"></p>
      </div>
    </section>

    <section class="section" style="padding-top:0">
      <div class="frame contact-grid">
        <!-- Kein Formular: der Button öffnet direkt das Mailprogramm.
             Adresse + Kopieren als Fallback für Webmail-Nutzer. -->
        <div class="contact-action reveal">
          <a class="btn btn--primary" href="mailto:jboforever@gmx.de" data-i18n-href="ct.mail.href">
            <span data-i18n="ct.mail.btn"></span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>
          </a>

          <div class="mail-line">
            <span class="addr">jboforever@gmx.de</span>
            <button id="copy-mail" class="btn btn--primary btn--sm" type="button" data-copy="jboforever@gmx.de">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h8"/></svg>
              <span data-i18n="ct.mail.copy"></span>
            </button>
          </div>
        </div>

        <!-- Direkte Kontaktdaten -->
        <aside class="contact-info reveal" style="transition-delay:.1s">
          <div class="row">
            <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s-7-5.2-7-11a7 7 0 0114 0c0 5.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span>
            <div>
              <div class="k" data-i18n="ct.info.location"></div>
              <div class="v" data-i18n="ct.info.location.v"></div>
            </div>
          </div>
          <div class="row">
            <span class="ico"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg></span>
            <div>
              <div class="k" data-i18n="ct.info.cv"></div>
              <a class="v" href="assets/files/cv-ben.pdf" download data-i18n="ct.info.cv.v"></a>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
</body>
</html>
